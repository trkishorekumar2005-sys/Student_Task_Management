<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Redirect to dashboard if already logged in
        if (localStorage.getItem('student_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="brand">
                <span class="brand-icon">📚</span>
                <span>Student Task Manager</span>
            </a>
            <div class="user-nav">
                <a href="register.html" class="btn btn-secondary btn-sm">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to access your student tasks</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="student@university.edu" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Student Task Manager.</p>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
