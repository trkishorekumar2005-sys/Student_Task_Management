<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Redirect to dashboard if already logged in
        if (localStorage.getItem('student_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="brand">
                <span class="brand-icon">📚</span>
                <span>Student Task Manager</span>
            </a>
            <div class="user-nav">
                <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
            </div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Register to manage your coursework tasks</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-input" 
                        placeholder="Alex Johnson" 
                        required 
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="alex@university.edu" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="At least 6 characters" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        class="form-input" 
                        placeholder="Repeat your password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Student Task Manager.</p>
        </div>
    </footer>

    <script src="js/register.js"></script>
</body>
</html>
