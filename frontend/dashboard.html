<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Check authentication immediately
        if (!localStorage.getItem('student_token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="dashboard.html" class="brand">
                <span class="brand-icon">📚</span>
                <span>Student Task Manager</span>
            </a>
            <div class="user-nav">
                <span class="student-greeting">Hello, <span id="studentNameDisplay" class="student-name">Student</span>!</span>
                <button id="logoutBtn" class="btn btn-secondary btn-sm">Log Out</button>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="container">
            <!-- Global Feedback Alert -->
            <div id="dashboardAlert" class="alert"></div>

            <!-- Add Task Form Card -->
            <section class="task-form-card">
                <h2>➕ Add a New Task</h2>
                <form id="createTaskForm">
                    <div class="form-group">
                        <label for="taskTitle" class="form-label">Task Title</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            class="form-input" 
                            placeholder="e.g. Complete CS101 Assignment 2" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="taskDescription" class="form-label">Description (Optional)</label>
                        <textarea 
                            id="taskDescription" 
                            class="form-textarea" 
                            placeholder="Add task notes, submission deadline, links, or instructions..."
                        ></textarea>
                    </div>
                    <button type="submit" id="addTaskBtn" class="btn btn-primary">Add Task</button>
                </form>
            </section>

            <!-- Tasks Filter & Header -->
            <div class="filter-bar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All Tasks</button>
                    <button class="filter-tab" data-filter="pending">Pending</button>
                    <button class="filter-tab" data-filter="completed">Completed</button>
                </div>
                <div id="taskCount" class="task-count">Loading tasks...</div>
            </div>

            <!-- Tasks List Container -->
            <div id="tasksList" class="tasks-list">
                <!-- Tasks will be injected dynamically via dashboard.js -->
            </div>
        </div>
    </main>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Edit Task</h3>
                <button type="button" class="modal-close-btn" id="closeEditModalBtn">&times;</button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <label for="editTaskTitle" class="form-label">Task Title</label>
                    <input type="text" id="editTaskTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="editTaskDescription" class="form-label">Description</label>
                    <textarea id="editTaskDescription" class="form-textarea"></textarea>
                </div>
                <div class="form-group">
                    <label for="editTaskStatus" class="form-label">Status</label>
                    <select id="editTaskStatus" class="form-input">
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Student Task Manager. Simple & student-friendly productivity.</p>
        </div>
    </footer>

    <script src="js/dashboard.js"></script>
</body>
</html>
